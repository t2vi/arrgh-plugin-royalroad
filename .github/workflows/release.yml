# Tag vX.Y.Z (matching package.json) → GitHub Release with <id>.js, <id>.js.sha256 and the
# catalog entry to paste into t2vi/arrgh's plugin-index/index.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi

      - name: Build bundle, checksum and catalog entry
        run: |
          id="$(node -p "require('./package.json').name.replace(/^arrgh-plugin-/, '')")"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$id.js"
          npx arrgh-plugin build --json --download-url "$url" > catalog-entry.json
          (cd dist && sha256sum -c "$id.js.sha256")
          echo "PLUGIN_ID=$id" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Catalog entry for \`plugin-index/index.json\` in [t2vi/arrgh](https://github.com/t2vi/arrgh). Open a PR there to publish this version:"
            echo
            echo '```json'
            cat catalog-entry.json
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            "dist/$PLUGIN_ID.js" "dist/$PLUGIN_ID.js.sha256" catalog-entry.json \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
